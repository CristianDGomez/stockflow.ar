<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StockFlow AR — ERP &amp; POS Offline (USD / ARS)</title>
  <style>
    :root {
      --bg: #0b0d12;
      --surface: #141821;
      --surface-2: #1c2230;
      --border: #283044;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #d4a359;
      --accent-hover: #e5b86b;
      --accent-soft: rgba(212, 163, 89, 0.14);
      --success: #10b981;
      --success-soft: rgba(16, 185, 129, 0.14);
      --danger: #ef4444;
      --danger-soft: rgba(239, 68, 68, 0.14);
      --warning: #f59e0b;
      --warning-soft: rgba(245, 158, 11, 0.14);
      --radius: 12px;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Topbar */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), #8a6227);
      color: #0b0d12;
      font-weight: 800;
      font-size: 1.1rem;
      display: grid;
      place-items: center;
      letter-spacing: -0.5px;
    }
